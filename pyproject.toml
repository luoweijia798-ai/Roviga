[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-stock-picker"
version = "0.1.0"
description = "A small, deterministic one-stock-per-day selection engine."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
daily-stock-picker = "stock_picker.example:main"

[tool.setuptools.packages.find]
where = ["src"]

